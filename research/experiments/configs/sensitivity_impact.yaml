# The impact sensitivity study (P6.8): how much each reference strategy's results depend on the impact
# half-life tau (P6.1), next to latency, the assumption P5.12 found its results least sensitive to.
#   python -m research.run research/experiments/configs/sensitivity_impact.yaml
# A suite like sensitivity.yaml: the same strategies, window and fees, and a large market TWAP (the one that
# takes enough liquidity for tau to matter); 16 runs each, 64 in all, each with its own comparison report
# (results/experiments/sensitivity_impact_*/report.html). Needs the packed Nov 10 dataset.
#
# tau: how long liquidity a strategy's taker fill took stays out of the book. 0 is the P3 behaviour (back as soon
# as the data next changes the level); 1 s, 10 s and 60 s bring it back by half each half-life.
# Latency: every leg a constant 0, 5, 20 or 50 ms. Queue model: pro rata throughout (the middle of P5.12's range).
description: Impact half-life x latency for the reference strategies, BTCUSDT 2026-11-10 02:00-03:00 UTC
defaults:
  dataset: data/packed/binance_spot_btc_eth_1110
  symbol: BTCUSDT
  window: {from: "2026-11-10T02:00:00Z", to: "2026-11-10T03:00:00Z", warmup_s: 60}
  seeds: [1]
  fees: {maker_rate: "0.001", taker_rate: "0.001"}
  queue_model: {model: pro_rata}
  sample_ms: 1000
  sweep:
    mode: grid
    params:
      impact.half_life_ms: [0, 1000, 10000, 60000]
      latency:
        - {feed: {model: constant, us: 0}, entry: {model: constant, us: 0}, ack: {model: constant, us: 0}}
        - {feed: {model: constant, us: 5000}, entry: {model: constant, us: 5000}, ack: {model: constant, us: 5000}}
        - {feed: {model: constant, us: 20000}, entry: {model: constant, us: 20000}, ack: {model: constant, us: 20000}}
        - {feed: {model: constant, us: 50000}, entry: {model: constant, us: 50000}, ack: {model: constant, us: 50000}}
    labels:
      impact.half_life_ms: ["tau 0", "tau 1 s", "tau 10 s", "tau 60 s"]
      latency: ["0 ms", "5 ms", "20 ms", "50 ms"]
experiments:
  - name: sensitivity_impact_mm
    description: Avellaneda-Stoikov market maker (gamma 0.0005, k 1000, 0.001 a side, at most 0.01)
    strategy:
      python: research.strategies.avellaneda_stoikov:AvellanedaStoikov
      params: {gamma: 0.0005, k: 1000, size: "0.001", max_position: "0.01", refresh_ms: 500}
  - name: sensitivity_impact_twap
    description: Passive TWAP buying 0.5 BTC over 50 minutes (post-only at the bid, market catch-up past 20% behind)
    strategy:
      python: research.strategies.execution:Executor
      params: {side: buy, quantity: "0.5", mode: twap, duration_ms: 3000000, style: passive, max_behind: 0.2}
  - name: sensitivity_impact_imbalance
    description: Order-book imbalance taker (top level, threshold 0.6, hold 1 s, cooldown 1 s)
    strategy:
      python: research.strategies.imbalance_taker:ImbalanceTaker
      params: {size: "0.001", levels: 1, threshold: 0.6, hold_ms: 1000, cooldown_ms: 1000}
  - name: sensitivity_impact_twap_large
    description: Market TWAP buying 50 BTC over 50 minutes, a slice every 10 s (about 0.17 BTC each)
    strategy:
      python: research.strategies.execution:Executor
      params: {side: buy, quantity: "50", mode: twap, duration_ms: 3000000, interval_ms: 10000, style: market}
