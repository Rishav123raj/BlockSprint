name: CI

on:
  push:
    branches: [main, v2, "release/**"]
  pull_request:

jobs:
  no-signing:
    # Live platform section 7.12: no code signs a Binance request. The one exception is the testnet latency tool
    # (P7.7), which signs only for testnet.binance.vision and refuses any other host.
    name: No Binance request signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: grep
        run: |
          hits=$(grep -rlE 'X-MBX-APIKEY|signature=|/api/v3/order' src scripts research --include='*.py' --include='*.cpp' --include='*.hpp' | grep -v '^research/live/testnet.py$' || true)
          if [ -n "$hits" ]; then echo "Binance request signing outside research/live/testnet.py:"; echo "$hits"; exit 1; fi
          grep -q '^BASE = "https://testnet.binance.vision"$' research/live/testnet.py

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
            configure: cmake -B build
            build: cmake --build build --config Release
            test: ctest --test-dir build -C Release --output-on-failure
            sim_tests: build/Release/sim_tests.exe
          - name: Linux / GCC
            os: ubuntu-latest
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
            build: cmake --build build -j 4
            test: ctest --test-dir build --output-on-failure
            sim_tests: build/sim_tests

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # asio and websocketpp

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Unit tests
        run: ${{ matrix.test }}

      # P3.17 (V1): the simulator's output hashes on the committed data slice, printed so the logs of the
      # two platforms can be compared; the test fails unless they equal the pinned values
      - name: Simulator determinism (V1)
        shell: bash
        run: ${{ matrix.sim_tests }} -ts=determinism -s | grep -A4 "output hashes"

  fuzz:
    # P1.16: 20 seeds x 50,000 = 10^6 random operations against the reference book (~30 s). Runs on every
    # push; PR builds already run 10^5 inside the unit tests
    name: Fuzz / 10^6 ops (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unit tests
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DBLOCKSPRINT_BUILD_SERVER=OFF -DBLOCKSPRINT_BUILD_BENCH=OFF
          cmake --build build -j 4 --target unit_tests
      - name: Fuzz
        env:
          BLOCKSPRINT_FUZZ_OPS: "50000"
        run: ./build/unit_tests -ts=fuzz

  python-tests:
    # P4.8: on Windows and Linux, the whole Python suite twice: on the developer path (uv sync, an editable
    # build) and on a built wheel installed into a clean environment. The wheels are kept as artifacts.
    name: Python / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a hang (e.g. a deadlocked worker process) fails fast instead of running for hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bin: Scripts
          - name: Linux
            os: ubuntu-latest
            bin: bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: uv sync (builds the module)
        run: uv sync
      - name: pytest (editable build)
        run: uv run pytest -q

      - name: Build the wheel
        run: uv build --wheel
      # The pytest executable, not `python -m pytest` (which would put the source tree first on the path), and
      # no pythonpath: both packages come from the wheel, and test_bindings.py checks that they do
      - name: pytest (the wheel, in a clean environment)
        shell: bash
        env:
          BLOCKSPRINT_EXPECT_INSTALLED: "1"
        run: |
          uv venv wheel-env --python 3.13
          uv pip install --python wheel-env dist/*.whl "pytest>=8.3"
          wheel-env/${{ matrix.bin }}/pytest -q -o pythonpath= -p no:cacheprovider tests/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

# A gitleaks secret-scan job is deferred until the decision on purging the old .env commit
# (commit f5d4b49) from history: a full-history scan would fail on it until then.
